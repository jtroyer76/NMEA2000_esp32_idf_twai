; Library repo. The driver lives in src/ and is consumed as a library (lib_deps = symlink://.)
; by both environments below.

[platformio]
src_dir = examples/BuildCheck

; Compile check on the target hardware of the first user (N2k.AIS_Gateway).
[env:m5stack-atom]
platform = espressif32 @ 6.8.1
board = m5stack-atom
framework = arduino
lib_deps =
    symlink://.

; Host-side unit tests of open/send/receive/supervision against a fake driver/twai.h
; (test/fakes). Run with `pio test -e native`. Needs a host gcc/g++ on PATH.
[env:native]
platform = native @ 1.2.1
build_flags =
    -std=gnu++17
    -D UNITY_INCLUDE_DOUBLE
    -I test/fakes
    -Wl,-static  ; self-contained test exe (avoids picking up a different libstdc++ DLL on Windows)
lib_deps =
    symlink://.
    throwtheswitch/Unity @ 2.6.1
lib_compat_mode = off  ; library.json targets espressif32/arduino; the tests build it on the host
test_build_src = no
